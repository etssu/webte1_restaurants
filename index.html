<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obedové Menu</title>

    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="left">
                <img src="favicon.svg" alt="Logo Obedové menu">
                <h1>Obedové Menu v okolí FEI STU</h1>
            </div>
            
            <p class="slogan">Vyber si to najchutnejšie, čo si môžeš dať!</p>
        </div>
    </header>

    <button class="hamburger" id="menu-toggle" aria-expanded="false" aria-controls="main-nav">
        ☰
    </button>
    
    <nav class="main-nav" aria-label="Hlavná navigácia">
        <div class="container">
            <a href="index.html" class="nav-link active"
               aria-current="page">Obedové menu</a>
            <a href="about.html" class="nav-link">O projekte</a>
        </div>
    </nav>

    <main>
        <section >
            <div id="day-selector" class="day-selector" aria-label="Výber dňa v týždni">
                <button type="button" class="day-button"
                        data-day="all">Celý týždeň</button>
                <button type="button" class="day-button"
                        data-day="1">Pondelok</button>
                <button type="button" class="day-button"
                        data-day="2">Utorok</button>
                <button type="button" class="day-button"
                        data-day="3">Streda</button>
                <button type="button" class="day-button"
                        data-day="4">Štvrtok</button>
                <button type="button" class="day-button"
                        data-day="5">Piatok</button>
            </div>

            <div id="restaurant-selector" class="restaurant-selector" aria-label="Výber reštaurácie">
                <button type="button" class="restaurant-button">Eat & Meet</button>
                <button type="button" class="restaurant-button">Naše Hospoda</button>
                <button type="button" class="restaurant-button">Reštaurácia Drag</button>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
        <p>Použité knižnice:</p>

        <ul>
            <li>
                <a href="https://getbootstrap.com/"
                   target="_blank"
                   rel="noopener noreferrer">
                    Bootstrap 5
                </a>
            </li>
            <li>
                <a href="https://jquery.com/"
                   target="_blank"
                   rel="noopener noreferrer">
                    jQuery
                </a>
            </li>
        </ul>

        <p>
            <a href="about.html">Viac o projekte</a>
        </p>
    </div>
    </footer>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
